<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <meta name="description" content="Discover Divine Timing Collective, a contemporary clothing brand offering distinctive streetwear, everyday essentials, and statement pieces designed for your style.">
        <meta name="keywords" content="Divine Timing Collective, Divine Timing clothing, Divine, Timing, contemporary streetwear, independent clothing brand, graphic apparel, statement clothing, casual streetwear, heavyweight shorts, everyday essentials, unisex clothing">

        <link rel="stylesheet" href="style.css">
        <style>
            button {
                text-decoration: none;
                font-family: 'Courier Prime', monospace;
                font-size: 12px;
                font-weight: 400;

                border: none;
                outline: none;
                background: #f4ebdc;
            }
            .dropPrice {
                font-family: 'Courier Prime', monospace;
                font-size: 12px;
                font-weight: 400;

                border: none;
                outline: none;
                background: none;
            }


            .dropMenu {
                display: none;
                position: absolute;
                width: 50px;
                background-color: #f4ebdc;
            }

            .dropdown:hover .dropMenu {
                display: block;
                background-color: #eee4d4;
                filter: drop-shadow(2px 2px 1px #B0211F);
            }

            .dropPrice:hover {
                filter: drop-shadow(1px 1px .5px #B0211F);
                background-color: #ece2d3;
                width: 50px;
            }
            

            .cust:hover {
                filter: drop-shadow(2px 2px 1px #B0211F);
            }

        </style>
    
    </head>

    <body>
        <!-- Scripts to control the header, clock, adn cart -->
        <header id="head"></header>
        <script src="header/header.js"></script> 
        <script src="clock/clock.js"></script> 
        <script src="cart.js"></script>
        
        
        <!-- Define all major content on home page -->
        <div class="all">
            <div class="filters">
                <h1>Browse By Category</h1>
                <button class="cust" id="cust" data-value="customizable">Customizable</button>
            </div>
            <div class="myGridh" id="grid"></div>
            <div class="sort">
                <h1>Sort</h1>
                <div class="dropdown">
                    <button class="priceButton" id="priceButton">Price</button>
                    <div class="dropMenu" id="dropMenu">
                        <button class="dropPrice" data-value="40">$40</button>
                        <button class="dropPrice" data-value="45">$45</button>
                        <button class="dropPrice" data-value="50">$50</button>
                        <button class="dropPrice" data-value="55">$55</button>
                        <button class="dropPrice" data-value="100">$100</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scripts to control the footer -->
        <footer id="footer"> </footer>
        <script src="footer/footer.js"></script> 
        

        <script>
            //define global variables for event processing
            const items = document.getElementById("grid");
            var clothing = "";
            var filtr = "Unisex";
            var custom = false;
            
            //Opens product page from home click
            function openProductPage(imageName) {
                window.location.href = `product.html?image=${encodeURIComponent(imageName)}`;
            }
            
            //Prints specific elemnts with image as well as name and price
            function printElem(elem){
                clothing += `
                    <div class="item" id="${elem.Name}">
                        <img src="${elem.ImagePath[0]}" alt="${elem.Name}" onClick="openProductPage('${elem.Name}')">
                        <div class="content"> 
                            <div class="items divine"> Divine Timing </div>
                            <div class="descript"> 
                                <span> ${elem.Name} </span>
                                <span> $${elem.Price} </span>
                            </div>
                            
                        </div>
                    </div>  `;
            }
            
            //function to read in and display correct clothes, all filtering 
            // done in function.
            function displayClothes(filtr){
                clothing = "";
                $.get("clothes.json", function(data) {
                    data.forEach(elem => {
                        if(elem.Stock > 0) {

                            //case statement to deal with all possible filters
                            if(filtr == "Unisex"){
                                printElem(elem);
                            } else if(filtr == elem.Gender) {
                                printElem(elem);
                            } else if(filtr == "custom"){

                                //ensures that mens and womans filter are kept 
                                // consistent with the top filter of mens, womans,
                                // and unisex.
                                if(elem.Custom){
                                    if(window.location.hash.substring(1).includes(elem.Gender)){
                                        printElem(elem);
                                    } else if(window.location.hash.substring(1)==''){
                                        printElem(elem);
                                    }
                                }
                            } else if(Number.isFinite(filtr)){

                                //ensures that mens and womans filter are kept 
                                // consistent with the top filter of mens, womans,
                                // and unisex.
                                if(elem.Price == filtr){
                                    if(window.location.hash.substring(1).includes(elem.Gender)){
                                        printElem(elem);
                                    } else if(window.location.hash.substring(1)==''){
                                        printElem(elem);
                                    }
                                }
                            }
                        }
                    })
                    //display clothes
                    if(clothing == ''){
                        items.innerHTML = "No Products Available"
                    }else {
                        items.innerHTML = clothing;
                    }
                    
                })
            }

            displayClothes(filtr);
        </script>

        <script>
            //define variables for Sorting
            const dropMenu = document.querySelectorAll(".dropPrice");
            const customButton = document.getElementById("cust");
            var customOn = false

            //filters home page for customizable items
            customButton.addEventListener("click", () => {
                if(!customOn){
                    displayClothes("custom");
                    customOn = true;
                } else {
                    if(window.location.hash.substring(1) == "mens"){
                        displayClothes("men");
                    } else if(window.location.hash.substring(1) == "womans") {
                        displayClothes("woman");
                    } else {
                        displayClothes(filtr);
                    }
                    customOn = false;
                }
            })

            //filter by price
            dropMenu.forEach(item => {
                item.addEventListener("click", () => {
                    var price = Number(item.dataset.value);
                    displayClothes(price);
                })
            })
        </script>
    </body>
</html>
