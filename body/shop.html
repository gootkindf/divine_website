<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Divine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        :root {
            --cream: #f3ebdc;
            --ink: #1a1a1a;
            --red: #c8281e;
            --frame: #f5f5f5;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 10px;
            background: var(--frame);
            font-family: "Courier Prime", monospace;
            color: var(--ink);
        }
        a { color: inherit; text-decoration: none; }
        .page {
            background: var(--cream);
            min-height: calc(100vh - 20px);
            padding: 0 28px 70px;
        }

        /* ---------- top bar ---------- */
        .navbar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 22px 0;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .navbar ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 22px; }
        .navbar .right { justify-content: flex-end; }
        .navbar .active { color: var(--red); font-weight: 700; text-decoration: underline; }
        .navbar .underline { text-decoration: underline; font-weight: 700; }
        .navbar .red { color: var(--red); font-weight: 700; }
        .logo {
            font-family: "Caveat Brush", cursive;
            font-size: 34px;
            color: var(--red);
            text-transform: lowercase;
        }

        /* ---------- hero ---------- */
        .hero { text-align: center; margin: 54px 0 56px; }
        .eyebrow {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3em;
            color: var(--red);
            text-transform: uppercase;
        }
        .hero h1 {
            font-size: clamp(34px, 5vw, 50px);
            font-weight: 700;
            margin: 10px 0 18px;
            letter-spacing: -0.01em;
        }
        .tagline { font-size: 18px; margin-bottom: 22px; }
        .tagline .divine-word {
            font-family: "Caveat Brush", cursive;
            color: var(--red);
            font-size: 26px;
        }
        .look-index {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 28px;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #555;
        }
        .look-index a:hover { color: var(--red); }

        /* ---------- looks ---------- */
        #looks {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 70px;
        }
        .look {
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            gap: 36px;
            align-items: stretch;
        }
        .look:nth-child(even) .big { order: 2; }
        .look:nth-child(even) .side { order: 1; }

        .big img {
            width: 100%;
            height: 100%;
            min-height: 380px;
            max-height: 620px;
            object-fit: cover;
            display: block;
        }
        .side {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 14px;
        }
        .smalls { display: flex; gap: 12px; }
        .smalls img {
            flex: 0 0 calc(50% - 6px);
            min-width: 0;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            display: block;
        }
        .caption .num {
            font-size: 9px;
            letter-spacing: 0.25em;
            color: var(--red);
            font-weight: 700;
            text-transform: uppercase;
        }
        .caption .title {
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            margin: 4px 0 12px;
        }
        .btn {
            display: inline-block;
            background: var(--red);
            color: #fff;
            font-family: inherit;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 9px 16px;
            border: 0;
            cursor: pointer;
        }
        .btn:hover { background: #a01f17; }

        @media (max-width: 700px) {
            .navbar { grid-template-columns: 1fr; gap: 12px; justify-items: center; }
            .navbar .right { justify-content: center; }
            .look { grid-template-columns: 1fr; }
            .look:nth-child(even) .big, .look:nth-child(even) .side { order: 0; }
        }
    </style>
</head>

<body>
<div class="page">

    <nav class="navbar">
        <ul>
            <li><a href="#" class="active">Mens</a></li>
            <li><a href="#">Womens</a></li>
            <li><a href="#">Unisex</a></li>
        </ul>
        <a href="default.asp" class="logo">divine</a>
        <ul class="right">
            <li><a href="#" class="underline">Gallery</a></li>
            <li><a href="#" class="red">Instagram &rarr;</a></li>
            <li><a href="#">Search</a></li>
            <li><a href="#">Bag (0)</a></li>
        </ul>
    </nav>

    <section class="hero">
        <div class="eyebrow">The Lookbook</div>
        <h1>Every piece, worn.</h1>
        <div class="tagline">Our time is truly <span class="divine-word">Divine</span></div>
        <div class="look-index" id="lookIndex"></div>
    </section>

    <div id="looks"></div>

</div>

<script>
    // Each look: a title, one big photo, and 0-2 small photos.
    // Photos are referenced by their ImagePath in pictures.json.
    // Reassign these however you like - this is my best guess.
    const LOOKS = [
        { title: "Fear Is The Mind Killer", big: "truck.jpg",       smalls: ["fear.png", "green_hat.png"] },
        { title: "Divne Divine Divine",     big: "divine.png",      smalls: ["chest_down.png", "kau2.png"] },
        { title: "Good Polo",               big: "goodpolo.png",    smalls: ["candy_cane.png"] },
        { title: "Track Jacket",            big: "trackjacket.png", smalls: ["gray_monolith.png"] },
        { title: "Salmon Cropped Hoodie",   big: "salmon.png",      smalls: [] },
        { title: "3/4 Sweat Nupey Shorts",  big: "shorts.png",      smalls: [] }
    ];

    function pad(n) { return String(n).padStart(2, "0"); }

    function buildLooks(items) {
        // only photos that are in stock
        const ok = new Set(items.map(e => e.ImagePath));
        let html = "", index = "";

        LOOKS.forEach((l, i) => {
            if (!ok.has(l.big)) return;
            const smalls = l.smalls.filter(p => ok.has(p));
            const title = l.title;
            const look = i;
            const id = "look" + pad(look + 1);

            index += `<a href="#${id}">Look ${pad(look + 1)} &nbsp;${title}</a>`;
            html += `
                <article class="look" id="${id}">
                    <div class="big"><img src="${l.big}" alt="${title}"></div>
                    <div class="side">
                        ${smalls.length ? `<div class="smalls">
                            ${smalls.map(p => `<img src="${p}" alt="${title}">`).join("")}
                        </div>` : ""}
                        <div class="caption">
                            <div class="num">Look ${pad(look + 1)}</div>
                            <div class="title">${title}</div>
                            <button class="btn">Shop this look</button>
                        </div>
                    </div>
                </article>`;
        });
        document.getElementById("looks").innerHTML = html;
        document.getElementById("lookIndex").innerHTML = index;
    }

    $.get("pictures.json", function(data) {
        buildLooks(data.filter(elem => !elem.OutOfStock));
    });
</script>
</body>
</html>
