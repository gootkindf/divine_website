<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <link rel="stylesheet" href="style.css">
<style>
    .myGrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 200px;                  
        grid-auto-flow: dense;                  
        gap: 16px;
    }

    .myGrid .item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .myGrid .item:nth-child(3n + 1) {
        grid-column: span 2;
        grid-row: span 2;
    }
    .container form {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 500px;
        margin: 0 auto;
    }

    .container label {
        display: block;
        margin-top: 8px;
    }

    .container input[type="text"],
    .container input[type="email"],
    .container select,
    .container textarea {
        width: 100%;
        box-sizing: border-box;
    }

    .container textarea {
        resize: vertical;
    }

    .container input[type="submit"] {
        align-self: flex-start;
        margin-top: 12px;
    }
    
    html, body {
        height: 100%;
        margin: 0;
    }

    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    .container {
        flex: 1;            
    }

    /* Just making sure the footer is in the right spot */
    footer {
        margin-top: auto; 
    }

</style>
</head>
    <script>
        // Get countries
        fetch('countries.json')
            .then(response => response.json())
            .then(countries => {
                const select = document.getElementById('country');
                countries.forEach(c => {
                    const option = document.createElement('option');
                    option.value = c.code;       // "US", "CA", ...
                    option.textContent = c.name; // "United States", ...
                    select.appendChild(option);
                });
            })
            .catch(err => console.error('Could not load countries:', err));
    </script>

    <body>
        <header id="head"></header>
        <script src="header/header.js"></script> 

        <!-- space between header and form -->
        <p><br><br></p> 

            <!-- HTML form -->
            <div class="container">
                <form action="action_page.php" method="post">
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" name="firstname" maxlength="50" required autocomplete="given-name">

                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" name="lastname" maxlength="50" required autocomplete="family-name">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" maxlength="254" required autocomplete="email">

                    <label for="country">Country</label>
                    <select id="country" name="country" required>
                        <option value="">Select a country...</option>
                    </select>

                    <label for="subject">Subject</label>
                    <textarea id="subject" name="subject" maxlength="2000" required style="height:200px"></textarea>

                    <input type="submit" value="Submit">
                </form>
            </div>
            
        <footer id="footer"> </footer>
        <script src="footer/footer.js"></script> 

        <script>
            // Listen for click basically
            document.addEventListener('DOMContentLoaded', () => {
                fetch('countries.json')
                    .then(response => {
                        if (!response.ok) throw new Error('HTTP ' + response.status);
                        return response.json();
                    })
                    .then(countries => {
                        const select = document.getElementById('country');
                        countries.forEach(c => {
                            const option = document.createElement('option');
                            option.value = c.code;        // Country code
                            option.textContent = c.name;  // Country name
                            select.appendChild(option);
                        });
                    })
                    .catch(err => console.error('Could not load countries:', err));
            });
        </script>
    </body>
</html>
