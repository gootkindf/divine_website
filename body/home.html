<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <link rel="stylesheet" href="style.css">
        
    
    </head>

    <body>
        <header id="head"></header>
        <script src="header/header.js"></script> 
        <script src="clock/clock.js"></script> 
        
        
        <div class="all">
            <div class="filters">
                <h1>Browse By Category</h1>
                <h1>Price Range</h1>
                <h1>Availability</h1>
                <h1>Deals</h1>
            </div>
            <div class="myGrid" id="grid"></div>
            <div class="sort">
                <h1>Sort</h1>
                <div>Featured</div>
                <div>Popularity</div>
                <div>Price</div>
                <div>Alphabetical</div>
            </div>
        </div>

        <script>
            const items = document.getElementById("grid");
            var clothing = "";
            var filtr = "Unisex";
            
            function openProductPage(imageName) {
                window.location.href = `product.html?image=${encodeURIComponent(imageName)}`;
            }
            
            function printElem(elem){
                clothing += `
                    <div class="item" id="${elem.Name}">
                        <img src="${elem.ImagePath}" alt="${elem.Name}" onClick="openProductPage('${elem.Name}')">
                        <div class="content"> 
                            <div class="items divine"> Divine Timing </div>
                            <div class="descript"> 
                                <span> ${elem.Name} </span>
                                <span> $${elem.Price} </span>
                            </div>
                            
                        </div>
                    </div>  `;
            }
            
            function displayClothes(filtr){
                clothing = "";
                $.get("clothes.json", function(data) {
                    data.forEach(elem => {
                        if(elem.Stock > 0) {
                            if(filtr == "Unisex"){
                                printElem(elem);
                            } else if(filtr == elem.Gender) {
                                printElem(elem);
                            }
                        }
                    })
                    items.innerHTML = clothing;
                })

            }

            displayClothes(filtr);

            


        </script>
    </body>

</html>
