<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="cart.js"></script>
    <title>Product Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="head"></header>
    <script src="header/prodHeader.js"></script>
    <div id="checkoutCart"></div>
    <script>
      function populateCheckoutCart() {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];

        const cartContainer = document.getElementById("checkoutCart");

        let html = "";
        let total = 0;

        cart.forEach((item) => {
          html += `
            <div class="cartItem">
                <img src="${item.image[0]}" id="${item.name}">
                <div>
                    <h3>${item.name}</h3>
                    <p>Size: ${item.size}</p>
                    <p>Qty: ${item.quantity}</p>
                    <p>$${item.price}</p>
                </div>
            </div>
        `;

          total += item.price * item.quantity;
        });

        cartContainer.innerHTML = html;

        document.getElementById("subtotal").textContent =
          `$${total.toFixed(2)}`;
      }
      populateCheckoutCart();
    </script>
  </body>
</html>
