<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <link rel="stylesheet" href="style.css">
<style>
    .myGrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);  /* adjust to your layout */
        grid-auto-rows: 200px;                   /* every cell gets the same row height */
        grid-auto-flow: dense;                   /* fills the gaps the big items leave */
        gap: 16px;
    }

    .myGrid .item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* items 1, 4, 7, 10, ... span 2 columns and 2 rows */
    .myGrid .item:nth-child(3n + 1) {
        grid-column: span 2;
        grid-row: span 2;
    }
</style>
</head>



<body>
    <header id="head"></header>
        <script src="header/header.js"></script> 
        <!-- <script src="clock/clock.js"></script>  -->
        
        <p><br><br></p>
        
        <div class="navbar">
        <!-- <div class="logo">My Logo</div> -->
            <ul>
                <li><a href="default.asp">Home</a></li>
                <li><a href="news.asp">Shop</a></li>
            </ul>
        </div>
        <div class="content">
            <div class="filters">
                <h3>Browse By Category</h3>
                <h3>Price Range</h3>
                <h3>Availability</h3>
                <h3>Deals</h3>
            </div>
            <div class="myGrid" id="grid"></div>
            <div class="sort">
                <h3>Sort</h3>
                <div>Featured</div>
                <div>Popularity</div>
                <div>Price</div>
                <div>Alphabetical</div>
            </div>
        </div>

        <script>
            const items = document.getElementById("grid");
            var clothing = "";
            
            function printElem(elem){
                clothing += `
                    <div class="item" id="${elem.Name}">
                        <img src="${elem.ImagePath}">
                        <div class="content"> 
                            <div class="descript"> 
                            </div>
                        </div>
                    </div>  `;
            }

            $.get("pictures.json", function(data) {
                data.forEach(elem => {
                    printElem(elem);
                })
                items.innerHTML = clothing;
            })

        </script>
    </body>
</html>
