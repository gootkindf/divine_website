<style>
    .myGrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);  /* adjust to your layout */
        grid-auto-rows: 200px;                   /* every cell gets the same row height */
        grid-auto-flow: dense;                   /* fills the gaps the big items leave */
        gap: 16px;
    }

    .myGrid .item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* items 1, 4, 7, 10, ... span 2 columns and 2 rows */
    .myGrid .item:nth-child(3n + 1) {
        grid-column: span 2;
        grid-row: span 2;
    }
</style>
</head>
    <script>
        fetch('countries.json')
            .then(response => response.json())
            .then(countries => {
                const select = document.getElementById('country');
                countries.forEach(c => {
                    const option = document.createElement('option');
                    option.value = c.code;       // "US", "CA", ...
                    option.textContent = c.name; // "United States", ...
                    select.appendChild(option);
                });
            })
            .catch(err => console.error('Could not load countries:', err));
    </script>
