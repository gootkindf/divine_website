<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Product Page</title>
    <link rel="stylesheet" href="style.css" />
    <style type="text/css">
      .content {
        margin-top: 100px;
        display: flex;
        width: 100%;
      }
      .sideColumn {
        margin-top: 50px;
        width: 25%;
        margin-left: 20px;
        margin-right: 20px;
      }
      .imgButton {
        width: 50px;
        height: 50px;
        border: 1px solid #1a1714;
        border-radius: 25px;
        background-color: transparent;
        font-size: 25px;
        transition: all 0.3s ease;
      }
      .imgButton:active {
        border-color: #fff;
        box-shadow:
          0 0 5px #fff,
          0 0 10px #fff,
          0 0 20px #fff;
      }
      #sizeSelect {
        width: 100%;
        height: 7%;
        background-color: transparent;
        font-family: "Courier Prime", monospace;
        font-size: 15px;
        font-weight: bold;
        padding-left: 10px;
      }
      #stockMarker {
        color: #b0211f;
        font-weight: bold;
        margin: 5px;
      }
      #price {
        font-weight: bold;
        font-size: 20px;
      }
      #productImg {
        max-width: 70%;
      }
      #productName {
        font-weight: bold;
      }
      #middleColumn {
        max-width: 50%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #descriptionTxt {
        color: #7d7871;
      }
    </style>
  </head>
  <body style="display: flex">
    <header id="head"></header>
    <script src="header/header.js"></script>
    <div class="content" id="content">
      <div class="sideColumn">
        Divine Timing
        <div id="productName"></div>
        <p id="descriptionTxt">{Add further descriptions here}</p>
      </div>
      <div id="middleColumn">
        <button class="imgButton" id="leftButton">←</button>
        <img id="productImg" />
        <button class="imgButton" id="rightButton">→</button>
      </div>
      <div class="sideColumn">
        <div id="price"></div>
        <div id="stockMarker"></div>
        <select id="sizeSelect">
          <option value="" disabled selected hidden>Select an size</option>
        </select>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const imageName = params.get("image");
      const product = {
        Name: imageName,
        Gender: "",
        Price: 0,
        ImagePath: "",
        Stock: 0,
        Sizes: {},
        Custom: false,
      };
      $.get("clothes.json", function (data) {
        data.forEach((elem) => {
          if (elem.Name == imageName) {
            product.Gender = elem.Gender;
            product.Price = elem.Price;
            product.ImagePath = elem.ImagePath[0];
            product.Stock = elem.Stock;
            product.Sizes = elem.Sizes;
            product.Custom = elem.Custom;
            product.Sizes.entries;
            document.getElementById("productName").innerHTML = product.Name;
            document.getElementById("productImg").src = product.ImagePath;
            document.getElementById("price").innerHTML = "$" + product.Price;
            if (product.Stock < 50) {
              document.getElementById("stockMarker").innerHTML = "⏺ Low stock";
            }
          }
        });
      });
    </script>
  </body>
</html>
