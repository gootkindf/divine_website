<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="cart.js"></script>
    <title>Product Page</title>
    <link rel="stylesheet" href="style.css" />
    <style type="text/css">
      @media (max-width: 400px) {
        .content {
          display: flex;
          flex-direction: column;
          max-width: 390px;
          margin: 0;
          align-items: center;
        }
        .sideColumn {
          margin-top: 30px !important;
          width: 80% !important;
          margin-bottom: 30px !important;
        }
        #middleColumn {
          max-width: 80% !important;
        }
        #middleImgDiv {
          width: 300px;
          display: flex;
          justify-content: space-evenly;
          align-items: center;
        }
        #productImg {
          max-width: 200px;
          max-height: 300px;
        }
      }
      .content {
        margin-top: 100px;
        margin-bottom: 125px;
        display: flex;
        width: 100%;
        justify-content: space-evenly;
      }
      .content button:active {
        border-color: #fff;
        box-shadow:
          0 0 5px #fff,
          0 0 10px #fff,
          0 0 20px #fff;
      }
      .sideColumn {
        margin-top: 50px;
        width: 25%;
        margin-left: 20px;
        margin-right: 20px;
      }
      .imgButton {
        width: 50px;
        height: 50px;
        border: 1px solid #1a1714;
        border-radius: 25px;
        background-color: transparent;
        font-size: 25px;
        transition: all 0.3s ease;
      }
      .fitDiv {
        display: flex;
        height: 100px;
        width: 100%;
        margin: 10px;
        align-items: center;
        border-bottom: 1px solid black;
      }
      .textDiv {
        display: flex;
        flex-direction: column;
        margin: 10px;
        margin-left: 20px;
        width: 70%;
        justify-content: center;
      }
      .textDiv h2,
      h3 {
        margin: 0;
      }
      .textDiv h3 {
        font-weight: normal;
      }
      .fitAddButton {
        height: 30%;
        width: 20%;
        background-color: #1a1714;
        color: white;
      }
      .fitImgContainer {
        position: relative;
        width: 30%;
        height: 100%;
      }
      .fitImgContainer img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .fitImgContainer:hover {
        border: 2px #b0211f solid;
      }
      .fitImgContainer:hover .viewLabel {
        opacity: 1;
      }
      .viewLabel {
        position: absolute;
        bottom: 6px;
        right: 6px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 2px 6px;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .smallMiddleImg {
        height: 100%;
        max-width: 50px;
        margin: 10px;
        cursor: pointer;
        border: 2px solid transparent;
        transition: all 0.3s ease;
      }
      .smallMiddleImg.active {
        border: 2px solid #b0211f;
        box-shadow: 0 0 8px rgba(176, 33, 31, 0.5);
      }
      #smallImagesDiv {
        display: flex;
        width: 100%;
        justify-content: center;
      }
      #fullFitAdd {
        border-color: #b0211f;
      }
      #p2 {
        font-family: "Special Elite", "Courier Prime", Courier, monospace;
        color: #b0211f;
        font-size: 15px;
      }
      #fitSection {
        margin-top: 10%;
      }
      #bagButton {
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        margin-top: 5%;
        width: 100%;
        height: 15%;
        background-color: #b0211f;
        box-shadow: 3px 3px 0 #000;
        font-weight: bold;
        font-family: "Special Elite", "Courier Prime", Courier, monospace;
        color: #f2eadb;
      }
      #bagButton p {
        margin: 0px;
        font-size: 30px;
      }
      #sizeSelect {
        padding-left: 10px;
      }
      #stockMarker {
        color: #b0211f;
        font-weight: bold;
        margin-top: 5px;
      }
      #price {
        font-weight: bold;
        font-size: 20px;
      }
      #productImg {
        max-width: 70%;
        max-height: 600px;
      }
      #productName {
        font-weight: bold;
      }
      #middleImgDiv {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #middleColumn {
        display: flex;
        flex-direction: column;
        max-width: 50%;
      }
      #descriptionTxt {
        color: #7d7871;
      }
    </style>
  </head>
  <body>
    <header id="head"></header>
    <script src="header/prodHeader.js"></script>
    <div class="content" id="content">
      <div class="sideColumn">
        Divine Timing
        <div id="productName"></div>
        <p id="descriptionTxt"></p>
      </div>

      <div id="middleColumn">
        <div id="middleImgDiv">
          <button class="imgButton" id="leftButton">←</button>
          <img id="productImg" />
          <button class="imgButton" id="rightButton">→</button>
        </div>

        <div id="smallImagesDiv">
          <img class="smallMiddleImg" id="small1" />
          <img class="smallMiddleImg" id="small2" />
          <img class="smallMiddleImg" id="small3" />
        </div>
      </div>

      <div class="sideColumn">
        <div id="price"></div>
        <div id="stockMarker"></div>
        <select id="sizeSelect" class="clearDiv">
          <option value="" disabled selected hidden>Select an size</option>
        </select>
        <button id="bagButton">
          <p>IT'S YOUR TIME</p>
          ADD TO BAG ·
        </button>
        <button id="buyButton" class="clearDiv">BUY IT NOW</button>
        <div id="fitSection">
          <p>COMPLETE THE FIT</p>
          <p id="p2">Wear the whole collective.</p>
        </div>
        <button id="fullFitAdd" class="clearDiv">ADD THE FULL FIT ·</button>
      </div>
    </div>
    <footer id="footer"></footer>
    <script src="footer/footer.js"></script>

    <script>
      function openProductPage(imageName) {
        window.location.href = `product.html?image=${encodeURIComponent(imageName)}`;
      }
      function getFitItems(data) {
        if (data.length < 3) return data;
        choices = [];

        while (choices.length < 3) {
          choice = data[Math.floor(Math.random() * data.length)];
          if (!choices.includes(choice)) {
            choices.push(choice);
          }
        }
        return choices;
      }
      function updateDisplayedImage() {
        document.getElementById("productImg").src = productImages[currentImage];

        document.querySelectorAll(".smallMiddleImg").forEach((img, index) => {
          img.classList.toggle("active", index == currentImage);
        });
      }
      function getSelectedSize() {
        let selectedSize = document.getElementById("sizeSelect").value;
        if (!selectedSize) {
          alert("Please select a size before adding to bag.");
          return;
        }
        return selectedSize;
      }
      const params = new URLSearchParams(window.location.search);
      const imageName = params.get("image");
      const product = {
        Name: imageName,
        Gender: "",
        Price: 0,
        ImagePath: "",
        Stock: 0,
        Sizes: {},
        OutOfStock: false,
        Custom: false,
        Description: "",
      };
      let currentImage = 0;
      let productImages = [];

      document.getElementById("rightButton").addEventListener("click", () => {
        currentImage = (currentImage + 1) % productImages.length;
        updateDisplayedImage();
      });
      document.getElementById("leftButton").addEventListener("click", () => {
        currentImage =
          (currentImage - 1 + productImages.length) % productImages.length;
        updateDisplayedImage();
      });
      document.querySelectorAll(".smallMiddleImg").forEach((img, index) => {
        img.addEventListener("click", () => {
          currentImage = index;
          updateDisplayedImage();
        });
      });
      $.get("clothes.json", function (data) {
        data.forEach((elem) => {
          if (elem.Name == imageName) {
            product.Gender = elem.Gender;
            product.Price = elem.Price;
            product.ImagePath = elem.ImagePath[0];
            product.Stock = elem.Stock;
            product.Sizes = elem.Sizes;
            product.Custom = elem.Custom;
            product.OutOfStock = elem.OutOfStock;
            product.Description = elem.Description;
            selectStr = "";
            Object.entries(product.Sizes).forEach(([size, count]) => {
              if (count > 0)
                selectStr += `<option value='${size}'> ${size} </option>`;
              else {
                selectStr += `<option value='${size}' disabled>${size} - SOLD OUT</option>`;
              }
            });
            document.getElementById("sizeSelect").innerHTML += selectStr;
            document.getElementById("productName").innerHTML = product.Name;
            document.getElementById("productImg").src = product.ImagePath;
            document.getElementById("descriptionTxt").innerHTML =
              product.Description;
            Array.from(
              document.getElementsByClassName("smallMiddleImg"),
            ).forEach((elem) => {
              elem.src = product.ImagePath;
              productImages.push(elem.src);
            });
            document.getElementById("price").innerHTML = `$${product.Price}`;
            document.getElementById("bagButton").innerHTML +=
              `$${product.Price}`;
            document
              .getElementById("bagButton")
              .addEventListener("click", () => {
                let size = getSelectedSize();
                if (size) addToCart(elem, size);
              });
            document
              .getElementById("buyButton")
              .addEventListener("click", () => {
                let size = getSelectedSize();
                if (size) bagAndGo(elem, size);
              });
            if (product.Stock < 50) {
              document.getElementById("stockMarker").innerHTML = "⏺ Low stock";
            }
            let fitItems = getFitItems(
              data.filter(
                (item) =>
                  item.Stock != 0 &&
                  item.Gender == product.Gender &&
                  item.Name != product.Name,
              ),
            );
            let totalPrice = 0;
            let divString = "";

            fitItems.forEach((item, index) => {
              divString += `<div class='fitDiv'>
                              <div class='fitImgContainer' onClick='openProductPage("${item.Name}")'>
                                <img src='${item.ImagePath[0]}' />
                                <span class='viewLabel'>VIEW</span>
                              </div>`;
              divString += `<div class='textDiv'>
                              <h2><u>${item.Name.toUpperCase()}</u></h2>
                              <h3>$${item.Price}</h3>
                            </div>`;
              divString += `<button class='fitAddButton' data-name='${item.Name}'>+ ADD</button></div>`;
              totalPrice += item.Price;
            });
            document.getElementById("fitSection").innerHTML += divString;
            document.querySelectorAll(".fitAddButton").forEach((button) => {
              button.addEventListener("click", () => {
                let size = getSelectedSize();
                if (!size) return;

                let itemToAdd = fitItems.find(
                  (item) => item.Name == button.dataset.name,
                );

                if (!itemToAdd) {
                  console.error("Could not find item:", button.dataset.name);
                  return;
                }
                addToCart(itemToAdd, size);
              });
            });
            const fullFit = document.getElementById("fullFitAdd");
            fullFit.innerHTML += `$${totalPrice + product.Price}`;
            fullFit.addEventListener("click", () => {
              document.querySelectorAll(".fitAddButton").forEach((button) => {
                button.click();
              });
              document.getElementById("bagButton").click();
            });
            updateDisplayedImage();
            return;
          }
        });
      });
    </script>
  </body>
</html>
