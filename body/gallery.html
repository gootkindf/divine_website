<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        .myGrid {
            display: flex;
            flex-direction: column;
            gap: 48px;
        }

        .myGrid .group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 200px;
            grid-auto-flow: dense;
            gap: 16px;
        }

        /* I was particuarly proud of this, as it allowed me to have a larger first picture */
        .myGrid .group .item:first-child {
            grid-column: span 2;
            grid-row: span 2;
        }

        .myGrid .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>

<body>
    <header id="head"></header>
    <script src="header/header.js"></script>
    <!-- <script src="clock/clock.js"></script> -->

    <p><br><br></p>

    <div class="content">
    <div class="myGrid" id="grid"></div>
    </div>

    <script>
        document.getElementById("unisex").classList.remove("active");
        document.getElementById("gallery").classList.add("active");

        const items = document.getElementById("grid");

        function itemHTML(elem) {
            return `
                <div class="item" id="${elem.Name}">
                    <img src="${elem.ImagePath}">
                    <div class="item-content">
                        <div class="descript"></div>
                    </div>
                </div>`;
        }

        $.get("pictures.json", function (data) {
            let html = "";
            for (let i = 0; i < data.length; i += 3) {
                html += `<div class="group">`;
                data.slice(i, i + 3).forEach(elem => {
                    html += itemHTML(elem);
                });
                html += `</div>`;
            }
            items.innerHTML = html;
        });
    </script>
    <footer id="footer"> </footer>
    <script src="footer/footer.js"></script> 
</body>
</html>
